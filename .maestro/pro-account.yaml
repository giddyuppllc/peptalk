# PepTalk — capture the PRO account screens.
#
# A LOCAL DEV BUILD (__DEV__, i.e. Metro) auto-grants Pro to every signed-in
# user, so it is the easiest way to capture clean "Pro account" marketing/QA
# shots. This used to be true of TestFlight and any preview build too, keyed off
# EXPO_PUBLIC_ENV — which meant a store-distributable binary gave Pro away and
# left Subscribe a no-op. It is now pinned to __DEV__.
#
# Consequence for this flow: run it against Metro. A TestFlight or store build
# will show the account's REAL tier, and these shots will not be Pro.
#
# Corollary worth remembering: because the bypass is live under Metro, a local
# build can never tell you what tier an account actually holds on the server.
# Assumes a session already
# exists (Supabase session persists in the Keychain across launches); if not,
# run login.yaml first with -e EMAIL=... -e PASSWORD=...
#
# NOTE: the dev "Open debugger to view warnings" banner is a NATIVE overlay that
# is NOT in the RN accessibility tree, so Maestro can't see/dismiss it by text and
# it covers the bottom tab bar. We reach Profile via the top-right avatar instead.
#
#   DEVELOPER_DIR=/Applications/Xcode.app/Contents/Developer \
#     maestro --device <sim-udid> test .maestro/pro-account.yaml
appId: com.peptalkapp.peptalk
tags:
  - screenshots
---
- launchApp

# Dev build loads JS from Metro on launch — wait for the home screen to settle.
- extendedWaitUntil:
    visible:
      text: "Hi, reviewer|Welcome"
    timeout: 30000

# 1) Open Profile via the top-right account avatar (avoids the covered tab bar).
- tapOn:
    point: "92%,11%"
- extendedWaitUntil:
    visible:
      text: "PRO|PepTalk Pro Active|Pro Status"
    timeout: 15000
- takeScreenshot: .maestro/screenshots/pro-profile

# 3) Open the Plans screen via the "Pro Status" settings row. The RN list rows
#    don't expose accessibility text, so tap by coordinate (row sits ~78% down).
- tapOn:
    point: "50%,78%"
- extendedWaitUntil:
    visible:
      text: "Choose Your Plan|Plans|Free|Pro"
    timeout: 15000
- takeScreenshot: .maestro/screenshots/pro-plans-top

# 4) Scroll through the plan cards (Pro shows as the current plan).
- scroll
- takeScreenshot: .maestro/screenshots/pro-plans-mid
- scroll
- takeScreenshot: .maestro/screenshots/pro-plans-bottom
