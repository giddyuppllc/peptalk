# PepTalk — Subscribe button is present + responsive (Guideline 2.1a).
#
# ── Needs a store that can actually sell. ─────────────────────────────────
#
# This proves the Subscribe button is present and responsive (Guideline 2.1a).
# It needs real products from a real billing service:
#   - iOS simulator: StoreKit returns products, so this runs.
#   - Android emulator with a `google_apis` image: there is NO Play Store and no
#     Play Billing, so `initConnection` fails with
#     "Failed to initialize billing connection", no products load, and the
#     paywall has nothing to show. The flow fails on the plan assertion.
#
# That failure is the emulator, not the app — and it is the same
# initialisation error as Sentry PEPTALK-1, now handled gracefully instead of
# crashing. To exercise this on Android you need a `google_apis_playstore`
# image and a signed-in Google account with a licence-tested build.
#
# The original 2.1a finding was an "unresponsive Subscribe button" — which
# happens when (a) the reviewer account is pre-entitled (so tapping no-ops), or
# (b) the IAP products aren't attached to the version (StoreKit has nothing to
# sell). This flow catches case (a): the reviewer account must be FREE so the
# Subscribe button is live.
#
# NOTE: the StoreKit purchase sheet is a SYSTEM overlay Maestro can't inspect,
# so this verifies the paywall + Subscribe affordance render — the actual
# purchase must be smoke-tested manually in the StoreKit sandbox.
#
#   maestro test .maestro/subscribe.yaml \
#     -e EMAIL=reviewer@peptalk.bio -e PASSWORD=<reviewer-password>
#
# Login is CONDITIONAL (a persisted Keychain session survives clearState), and
# the paywall is reached via deep link rather than tapping a profile row whose
# label varies by tier.
appId: com.peptalkapp.peptalk
tags:
  - smoke
---
- launchApp:
    clearState: true
- runFlow: prepare-app.yaml
- runFlow:
    when:
      visible: "Sign In"
    commands:
      - tapOn: "Sign In"
      - tapOn: "Email address"
      - inputText: ${EMAIL}
      - tapOn: "Password"
      - inputText: ${PASSWORD}
      - hideKeyboard
      - tapOn:
          text: "Log in"
          index: 0
      - extendedWaitUntil:
          notVisible: "Email address"
          timeout: 20000

# Subscription paywall (deep link — robust against tier-dependent row copy).
- openLink:
    link: "peptalk://subscription"
- extendedWaitUntil:
    visible: "Choose Your Plan|Plans|Subscribe|Upgrade|Start|Free|Pro|Have a discount code"
    timeout: 15000
- takeScreenshot: .maestro/screenshots/paywall
